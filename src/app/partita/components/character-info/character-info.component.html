<!-- src/app/partita/components/character-info/character-info.component.html -->
<div class="character-card" *ngIf="selectedCharacter$ | async as character">
  <div class="character-header">
    <h3 class="character-name">{{character.nome}}</h3>
  </div>

  <div class="character-stats">
    <div class="stat-row">
      <div class="stat-label">
        <mat-icon>favorite</mat-icon>
        PV
      </div>
      <div class="stat-bar">
        <div class="stat-fill hp" [style.width.%]="100"></div>
        <span class="stat-value">100</span>
      </div>
    </div>
  </div>

  <div class="character-details">
    <div class="detail-row">
      <mat-icon>shield</mat-icon>
      <span>Difesa: {{character.difesa}}</span>
    </div>
    <div class="detail-row">
      <mat-icon>sports_martial_arts</mat-icon>
      <span>Attacco: {{character.attacco}}</span>
    </div>
    <div class="detail-row">
      <mat-icon>description</mat-icon>
      <span>{{character.descrizione}}</span>
    </div>
  </div>
</div>
