<!-- src/app/partita/components/turn-info/turn-info.component.html -->
<div class="turn-info-container">
    <div class="turn-header">
      <h2 class="turn-title">Turno <span>{{turnNumber$ | async}}</span></h2>
      <div class="turn-phase" [class.player-turn]="isPlayerTurn$ | async">
        {{ (isPlayerTurn$ | async) ? 'Turno Giocatore' : 'Turno Avversario' }}
      </div>
    </div>
  
    <div class="turn-details">
      <div class="current-player">
        <mat-icon>person</mat-icon>
        <span>{{currentTurn$ | async}}</span>
      </div>
    </div>
  
    <button class="end-turn-btn" (click)="endTurn()" *ngIf="isPlayerTurn$ | async">
      <mat-icon>skip_next</mat-icon>
      Fine Turno
    </button>
  </div>
