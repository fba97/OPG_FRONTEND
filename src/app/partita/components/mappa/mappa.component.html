<!-- Mappa di sfondo con controlli -->
<div class="map-frame">
  <div class="map-background">
    <div class="map-container" #mapContainer>
      <div *ngIf="svgContent" [innerHTML]="svgContent" class="svg-content"></div>
      <div *ngIf="!svgContent" class="loading">
        <mat-spinner diameter="40"></mat-spinner>
        <span>Caricamento mappa...</span>
      </div>
    </div>
    <div class="map-controls" *ngIf="cameraState === 'area'">
      <button mat-mini-fab (click)="tornaAOverview()" class="map-control-btn" title="Torna alla mappa">
        <mat-icon>arrow_back</mat-icon>
      </button>
    </div>
  </div>
</div>
