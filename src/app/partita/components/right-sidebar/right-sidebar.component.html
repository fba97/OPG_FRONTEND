<!-- right-sidebar.component.html -->
<div class="right-sidebar" [class.collapsed]="!isOpen">
    <button class="sidebar-toggle" (click)="toggle()">
      <mat-icon>{{ isOpen ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  
    <div class="sidebar-content" *ngIf="isOpen">
      <div class="scroll-container">
        <!-- Sezione Turno -->
        <app-turn-info></app-turn-info>
  
        <!-- Sezione Personaggio -->
        <app-character-info></app-character-info>
  
        <!-- Sezione Stato Partita -->
        <app-personaggi></app-personaggi>
      </div>
    </div>
  </div>
