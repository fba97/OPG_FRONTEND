<!-- src/app/partita/partita.component.html -->
<div class="game-container">
  <app-left-sidebar [menuItems]="menuItems">
    <app-game-status></app-game-status>
  </app-left-sidebar>

  <div class="main-column">
    <app-turn></app-turn>
    <div class="main-content">
      <app-mappa></app-mappa>
    </div>
  </div>

  <app-character-actions></app-character-actions>

  <app-combat-modal></app-combat-modal>

  <div class="victory-overlay" *ngIf="hasWon$ | async">
    <div class="victory-panel">
      <h1 class="victory-panel__title">Vittoria!</h1>
      <p class="victory-panel__text">Doflamingo è stato sconfitto. Dressrosa è libera.</p>
      <a routerLink="/homepage" class="btn btn--gold">Torna alla home</a>
    </div>
  </div>
</div>
