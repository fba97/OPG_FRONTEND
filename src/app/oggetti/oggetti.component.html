<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Lista oggetti</title>

</head>

<body>

    <div class="container" style="width: 200%;">
        <a href="http://localhost:4200/homepage" class="btn btn-warning btn-lg btn-block">Homepage</a>
        <button type="button" class="btn btn-warning btn-lg btn-block margin"
            style="margin-left: 42px; width: 220px; font-weight: 500;" (click)=" generaOggetti()">Genera
            OGGETTI</button>
        <div class="row" style="width: 2000px; float:left;">
            <ng-container *ngFor="let i of itemsList; let index = index">
                <div class="col-2">
                    <table>
                        <tr>
                            <td>
                                <a [href]="'http://localhost:4200' + i.carta"><img [src]="i.carta" class="carte"></a>

                            </td>
                        </tr>
                        <tr>

                            <td>
                                <br>
                                <!-- <button type="button" class="btn btn-warning btn-lg btn-block margin"
                                        style="margin-left: 42px; width: 220px; font-weight: 500;"
                                        (click)="utilizza(i.id)">Utilizza</button> -->
                            </td>

                        </tr>
                    </table>
                </div>
                <ng-container *ngIf="(index + 1) % 5 === 0 || index + 1 === itemsList.length">
                    <div class="row"></div>
                </ng-container>
            </ng-container>
        </div>

    </div>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>


</body>

</html>
