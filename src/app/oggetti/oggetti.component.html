<div class="card-grid-page">
  <app-left-sidebar [menuItems]="menuItems"></app-left-sidebar>

  <div class="card-grid-page__content">
    <h1 class="card-grid-page__title">Oggetti</h1>

    <div class="filter-bar">
      <button class="filter-chip" [class.active]="currentFilter === 'tutti'" (click)="currentFilter = 'tutti'">Tutti</button>
      <button class="filter-chip" [class.active]="currentFilter === TipoOggetto.Generico" (click)="currentFilter = TipoOggetto.Generico">Generici</button>
      <button class="filter-chip" [class.active]="currentFilter === TipoOggetto.Probabilita" (click)="currentFilter = TipoOggetto.Probabilita">Probabilità</button>
      <button class="filter-chip" [class.active]="currentFilter === TipoOggetto.Imprevisto" (click)="currentFilter = TipoOggetto.Imprevisto">Imprevisti</button>
    </div>

    <div class="card-grid" *ngIf="filteredList.length; else vuoto">
      <div class="entity-card" *ngFor="let o of filteredList" [title]="o.descrizione">
        <app-card-frame>
          <img [src]="resolveImage(o)" [alt]="o.nome">
        </app-card-frame>
        <span class="entity-card__name">{{ o.nome }}</span>
        <div class="entity-card__meta" *ngIf="o.bonusAttacco || o.bonusDifesa">
          <span *ngIf="o.bonusAttacco" title="Bonus attacco">⚔ +{{ o.bonusAttacco }}</span>
          <span *ngIf="o.bonusDifesa" title="Bonus difesa">🛡 +{{ o.bonusDifesa }}</span>
        </div>
      </div>
    </div>
    <ng-template #vuoto>
      <div class="card-grid__empty">Nessun oggetto trovato.</div>
    </ng-template>
  </div>
</div>
