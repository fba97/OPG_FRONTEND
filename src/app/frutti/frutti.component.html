<div class="card-grid-page">
  <app-left-sidebar [menuItems]="menuItems"></app-left-sidebar>

  <div class="card-grid-page__content">
    <h1 class="card-grid-page__title">Frutti del Diavolo</h1>

    <div class="card-grid">
      <div class="entity-card" *ngFor="let f of fruitsList" [title]="f.descrizione">
        <app-card-frame>
          <img [src]="f.carta" [alt]="f.nome">
        </app-card-frame>
        <span class="entity-card__name">{{ f.nome }}</span>
      </div>
    </div>
  </div>
</div>
