<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lista oggetti</title>

<body background="/assets/images/background.jpg" style="position: relative; align-items: center;">

        </div>
    </div>
    <div class="d-flex">

                <tr>
                    <td>
                        <button type="button" class="btn btn-warning btn-lg btn-block margin"
                            style="margin-left: 42px; width: 220px; font-weight:500;"

                        <br>
                        <br>
                        <br>
                        <br>
                        <br>
                        <br>
                        <br>
                        <br>
                        <br>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"

</html>
