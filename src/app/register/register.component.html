<div class="auth-page">
  <div class="auth-page__panel">
    <a routerLink="/mainpage" class="auth-page__back">← Torna alla pagina principale</a>
    <h2 class="auth-page__title">Registrazione</h2>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="auth-form__field">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" [(ngModel)]="user.nome" required>
      </div>
      <div class="auth-form__field">
        <label for="surname">Cognome</label>
        <input type="text" id="surname" name="surname" [(ngModel)]="user.cognome" required>
      </div>
      <div class="auth-form__field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="user.email" required>
      </div>
      <div class="auth-form__field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" [(ngModel)]="user.username" required>
      </div>
      <div class="auth-form__field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="user.password" required>
      </div>

      <button type="submit" class="btn btn--gold auth-form__submit">Registrati</button>
    </form>
  </div>
</div>
