<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Combattimento</title>
</head>

<body>

    <div id="fight-form-modal">
        <h2>Seleziona i personaggi per il combattimento</h2>
        <form id="fight-form" class="form-container">
            <!--menu a tendina per selezionare i boss, ciclati in base al numero di boss-->
            <label for="hero-select">Seleziona i boss:</label>
            <div class="hero-select-container">
                <select *ngFor="let player of bossList; let i=index" [id]="'boss-select-'+i" name="boss-select"
                    (change)="onBossSelected($event)">
                    <option></option>
                    <option *ngFor="let boss of bossList" [value]="boss.id" [disabled]="isBossSelected(boss.id)">
                        {{ boss.nome }}
                    </option>
                </select>
            </div>

            <p *ngIf="bossSelectionError" class="error-message">Non puoi selezionare lo stesso personaggio più di una
                volta.</p>

            <!--menu a tendina per selezionare gli eroi, ciclati in base al numero di eroi in partita-->

            <label for="hero-select">Seleziona gli eroi:</label>
            <div class="hero-select-container">
                <select *ngFor="let player of heroesList; let i=index" [id]="'hero-select-'+i" name="hero-select"
                    (change)="onHeroSelected($event)">
                    <option></option>
                    <option *ngFor="let hero of heroesList" [value]="hero.id" [disabled]="isHeroSelected(hero.id)">
                        {{ hero.nome }}
                    </option>
                </select>
            </div>

            <p *ngIf="heroSelectionError" class="error-message">Non puoi selezionare lo stesso personaggio più di
                una volta.</p>

            <button type="submit" class="btn"
                [disabled]="heroSelectionError || bossSelectionError || !isHeroSelected || !isBossSelected"
                (click)="generaCombattimento()">Conferma</button>

        </form>
    </div>














    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
