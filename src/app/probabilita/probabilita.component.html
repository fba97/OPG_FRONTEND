<div class="card-grid-page">
  <app-left-sidebar [menuItems]="menuItems"></app-left-sidebar>

  <div class="card-grid-page__content">
    <h1 class="card-grid-page__title">Probabilità</h1>

    <button class="btn btn--gold" (click)="generaProbabilita()">Pesca una carta</button>

    <div class="carta-estratta" *ngIf="cartaEstratta">
      <app-card-frame [selected]="true">
        <img [src]="cartaEstratta.carta" [alt]="cartaEstratta.nome">
      </app-card-frame>
      <span class="entity-card__name">{{ cartaEstratta.nome }}</span>
    </div>

    <div class="card-grid">
      <div class="entity-card" *ngFor="let p of probabilitaList">
        <app-card-frame [compact]="true">
          <img [src]="p.carta" [alt]="p.nome">
        </app-card-frame>
        <span class="entity-card__name">{{ p.nome }}</span>
      </div>
    </div>
  </div>
</div>
