<div class="card-grid-page">
  <app-left-sidebar [menuItems]="menuItems"></app-left-sidebar>

  <div class="card-grid-page__content">
    <h1 class="card-grid-page__title">Eroi &amp; Nemici</h1>

    <div class="filter-bar">
      <button class="filter-chip" [class.active]="currentFilter === 'tutti'" (click)="currentFilter = 'tutti'">Tutti</button>
      <button class="filter-chip" [class.active]="currentFilter === 'eroi'" (click)="currentFilter = 'eroi'">Eroi</button>
      <button class="filter-chip" [class.active]="currentFilter === 'nemici'" (click)="currentFilter = 'nemici'">Nemici</button>
    </div>

    <div class="card-grid" *ngIf="filteredList.length; else vuoto">
      <div class="entity-card" *ngFor="let p of filteredList">
        <app-card-frame [selected]="isCardNemico(p)">
          <img [src]="resolveImage(p)" [alt]="p.nome">
        </app-card-frame>
        <span class="entity-card__name">{{ p.nome }}</span>
        <div class="entity-card__meta">
          <span title="Vita">❤ {{ p.punti_Vita }}</span>
          <span title="Attacco">⚔ {{ p.attacco }}</span>
          <span title="Difesa">🛡 {{ p.difesa }}</span>
        </div>
      </div>
    </div>
    <ng-template #vuoto>
      <div class="card-grid__empty">Nessun personaggio trovato.</div>
    </ng-template>
  </div>
</div>
