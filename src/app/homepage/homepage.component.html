<div class="homepage">
  <app-left-sidebar [menuItems]="menuItems"></app-left-sidebar>

  <div class="homepage__content">
    <div class="homepage__panel card-frame-panel">
      <h2 class="homepage__title">Nuova partita</h2>

      <div class="homepage__section">
        <div class="homepage__section-form">
          <input type="text" [(ngModel)]="nomePartita" name="nomePartita" placeholder="Nome partita" class="text-input">
          <button type="button" class="btn btn--gold" (click)="creaPartita()">Crea partita</button>
          <div *ngIf="creaPartitaErrore" class="error-text">{{ creaPartitaErrore }}</div>
        </div>

        <div class="homepage__section-heroes">
          <label class="section-label">Seleziona gli eroi</label>
          <div class="hero-select-list">
            <label class="hero-checkbox" *ngFor="let hero of personaggiList">
              <input type="checkbox" [(ngModel)]="hero.selected" name="{{ hero.nome }}">
              {{ hero.nome }}
            </label>
          </div>
        </div>

        <div class="homepage__section-saga">
          <label class="section-label">Saga</label>
          <div class="saga-select-list">
            <label class="saga-radio" *ngFor="let s of listaSaga">
              <input type="radio" name="saga" [value]="s" [(ngModel)]="selectedSaga">
              {{ s }}
            </label>
          </div>
        </div>
      </div>

      <hr class="homepage__divider">

      <h2 class="homepage__title">Carica partita</h2>
      <div class="homepage__section">
        <div class="homepage__section-form">
          <button type="button" class="btn btn--outline-dark" (click)="caricaPartita()">Carica partite</button>
          <button type="button" class="btn btn--gold" [disabled]="selectedPartitaId == null" (click)="confermaCaricamento()">Carica la selezionata</button>
          <div *ngIf="caricaPartitaErrore" class="error-text">{{ caricaPartitaErrore }}</div>
        </div>

        <div class="homepage__section-saved-games">
          <label class="section-label">Partite salvate</label>
          <div class="saved-games-list">
            <div class="saved-game-row" *ngFor="let p of listaPartite">
              <label class="saga-radio">
                <input type="radio" name="partita" [value]="p.idPartita" [(ngModel)]="selectedPartitaId">
                {{ p.nome }} (id {{ p.idPartita }})
              </label>
              <button type="button" class="btn btn--danger btn--small" (click)="eliminaPartita(p.idPartita)">Elimina</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
